# =============================================================================
# Dev Environment: Database (Wave 1)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/partha6296/devops_project.git'
    targetRevision: HEAD
    path: gitops/environments/dev
    directory:
      include: 'postgres.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: taskapp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# =============================================================================
# Dev Environment: User Service (Wave 2)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-user-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://github.com/partha6296/devops_project.git'
    targetRevision: HEAD
    path: gitops/charts/microservice
    helm:
      valueFiles:
        - ../../environments/dev/user-service-values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: taskapp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

